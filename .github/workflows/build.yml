name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: unzip -q FloatingTranslator.zip
      - name: Download Arabic OCR data
        run: |
          mkdir -p FloatingTranslator/app/src/main/assets/tessdata
          curl -L -o FloatingTranslator/app/src/main/assets/tessdata/ara.traineddata \
            https://github.com/tesseract-ocr/tessdata_fast/raw/main/ara.traineddata
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
        working-directory: FloatingTranslator
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp FloatingTranslator/app/build/outputs/apk/debug/app-debug.apk translator.apk
          gh release delete v1 --cleanup-tag -y || true
          gh release create v1 translator.apk --title "APK" --notes "APK"
